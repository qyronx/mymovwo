/* ---------- catalog ---------- */
const catalogKey = pk => `${CATALOG_STORE}:${pk}`;
function parseCatalog(k){ try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch { return {}; } }
function readCatalog(pk){
  if (!pk) return {};
  const scoped = parseCatalog(catalogKey(pk));
  if (Object.keys(scoped).length) return scoped;
  const legacy = parseCatalog(CATALOG_STORE);
  const migrated = Object.fromEntries(Object.entries(legacy).filter(([, e]) => e && e.owner === pk));
  if (Object.keys(migrated).length) localStorage.setItem(catalogKey(pk), JSON.stringify(migrated));
  return migrated;
}
function saveCatalog(){ if (state.pubkey) localStorage.setItem(catalogKey(state.pubkey), JSON.stringify(state.catalog)); }
function setNotice(message, error = false){ state.notice = message ? { message, error } : null; render(); }
const size = n => n >= 1073741824 ? `${(n/1073741824).toFixed(2)} GB` : `${(n/1048576).toFixed(1)} MB`;
const date = u => new Intl.DateTimeFormat(state.lang === "ko" ? "ko-KR" : "en-GB", { dateStyle:"medium" }).format(new Date(u * 1000));

  <section class="main"><div class="utility"><div class="lang"><button data-lang="en" class="${state.lang==="en"?"active":""}">EN</button><button data-lang="ko" class="${state.lang==="ko"?"active":""}">KO</button></div></div>
  <header class="dash-title"><div><p class="eyebrow">${x.dashboardEye}</p><h1>${x.dashboardTitle}</h1></div><p class="dash-detail">${x.dashboardDetail}</p></header>

const noticeHTML = () => state.notice ? `<div class="notice ${state.notice.error?"error":""}"><span><strong>${t().connection}</strong><br>${esc(state.notice.message)}</span><button class="notice-close" data-action="notice-close">×</button></div>` : "";

/* search + batch selection: DOM-only updates, no re-render */
function applyFilter(){
  const list = document.getElementById("reel-list"); if (!list) return;
  const q = state.filter.trim().toLocaleLowerCase();
  const rows = [...list.querySelectorAll(".movie")];
  let visible = 0;
  rows.forEach(r => {
    const ok = !q || (r.querySelector(".movie-name").textContent || "").toLocaleLowerCase().includes(q);
    r.hidden = !ok; if (ok) visible++;
  });
  const res = document.getElementById("reel-result"); if (res) res.textContent = `${visible}/${rows.length} ${t().shown}`;
  const empty = document.getElementById("filter-empty"); if (empty) empty.hidden = !(rows.length && !visible);
  updateBatch();
}
function updateBatch(){
  const list = document.getElementById("reel-list"); if (!list) return;
  const rows = [...list.querySelectorAll(".movie")];
  rows.forEach(r => r.classList.toggle("picked", state.picked.has(r.dataset.select)));
  const vis = rows.filter(r => !r.hidden);
  const all = vis.length > 0 && vis.every(r => state.picked.has(r.dataset.select));
  const a = document.getElementById("batch-all"), d = document.getElementById("batch-delete");
  if (a) a.textContent = all ? t().clear : t().selAll;
  if (d){ d.disabled = state.picked.size === 0; d.textContent = state.picked.size ? `${t().delSel} (${state.picked.size})` : t().delSel; }
}

function bind(){
  const $$ = (s, f) => document.querySelectorAll(s).forEach(f);
  $$("[data-action]", e => e.addEventListener("click", () => action(e.dataset.action, e)));
  $$("[data-lang]", e => e.addEventListener("click", () => { state.lang = e.dataset.lang; localStorage.setItem("mymovieworld:lang", state.lang); render(); }));
  $$("[data-scroll]", e => e.addEventListener("click", () => document.getElementById(e.dataset.scroll)?.scrollIntoView({ behavior:"smooth" })));
  $$("[data-select]", e => e.addEventListener("click", () => {
    state.active = state.movies.find(m => m.sha256 === e.dataset.select);
    if (state.playerURL){ URL.revokeObjectURL(state.playerURL); state.playerURL = ""; }
    render();
  }));
  $$("[data-play]", e => e.addEventListener("click", ev => { ev.stopPropagation(); preparePlayback(e.dataset.play); }));
  $$("[data-download]", e => e.addEventListener("click", ev => { ev.stopPropagation(); saveMovie(e.dataset.download); }));
  $$("[data-delete]", e => e.addEventListener("click", ev => { ev.stopPropagation(); state.pending = state.movies.find(m => m.sha256 === e.dataset.delete); render(); }));
  $$("[data-choice]", e => {
    e.addEventListener("click", ev => ev.stopPropagation());
    e.parentElement.addEventListener("click", ev => ev.stopPropagation());
    e.addEventListener("change", () => { e.checked ? state.picked.add(e.dataset.choice) : state.picked.delete(e.dataset.choice); updateBatch(); });
  });
  const search = document.getElementById("reel-search");
  if (search) search.addEventListener("input", ev => { state.filter = ev.target.value; applyFilter(); });
  const all = document.getElementById("batch-all");
  if (all) all.addEventListener("click", () => {
    const vis = [...document.querySelectorAll("#reel-list .movie")].filter(r => !r.hidden);
    const every = vis.length > 0 && vis.every(r => state.picked.has(r.dataset.select));
    vis.forEach(r => every ? state.picked.delete(r.dataset.select) : state.picked.add(r.dataset.select));
    document.querySelectorAll("[data-choice]").forEach(c => c.checked = state.picked.has(c.dataset.choice));
    updateBatch();
  });
  const del = document.getElementById("batch-delete");
  if (del) del.addEventListener("click", async () => {
    const hashes = [...state.picked];
    if (!hashes.length || !window.confirm(t().confirmMany.replace("{n}", hashes.length))) return;
    del.disabled = true;
    await deleteMany(hashes);
  });
  const input = document.getElementById("file-input");
  if (input) input.addEventListener("change", e => { const f = [...(e.target.files || [])]; e.target.value = ""; if (f.length) uploadMany(f); });
  const zone = document.getElementById("drop-zone");
  if (zone){
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
    zone.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("drag"); const f = [...(e.dataTransfer.files || [])]; if (f.length) uploadMany(f); });
  }
  const key = document.getElementById("key-input");
  if (key) key.addEventListener("input", e => state.keyValue = e.target.value);
}

function action(name, el){
  if (name === "mode-create"){ state.createMode = "create"; render(); }
  else if (name === "mode-import"){ state.createMode = "import"; render(); }
  else if (name === "generate"){ try { saveSecret(randomSecret()); } catch (e) { setNotice(e.message, true); } }
  else if (name === "import"){ try { saveSecret(parseSecret(state.keyValue)); } catch { setNotice(t().keyBad, true); } }
  else if (name === "sync"){ sync(); }
  else if (name === "copy-key"){ copyKey(el); }
  else if (name === "erase"){
    localStorage.removeItem(KEY_STORE);
    Object.assign(state, { secret:null, pubkey:"", movies:[], active:null, notice:null, filter:"" });
    state.picked.clear(); clearPlayer(); render();
  }
  else if (name === "notice-close"){ state.notice = null; render(); }
  else if (name === "cancel-delete"){ state.pending = null; render(); }
  else if (name === "confirm-delete"){ deleteMovie(state.pending); }
}
async function copyKey(btn){
  const k = localStorage.getItem(KEY_STORE);
  if (!k){ window.alert(t().noKey); return; }
  try { await navigator.clipboard.writeText(k); const o = btn.textContent; btn.textContent = `✓ ${t().copied}`; setTimeout(() => { btn.textContent = o; }, 1600); }
  catch { window.prompt(t().copyKey, k); }
}

/* ---------- secp256k1 (Jacobian coordinates: one inversion per multiplication) ---------- */
const mod = (a, m = P) => { const x = a % m; return x >= 0n ? x : x + m; };
function pow(a, b, m = P){ let r = 1n, x = mod(a, m); while (b){ if (b & 1n) r = mod(r * x, m); x = mod(x * x, m); b >>= 1n; } return r; }
const inv = a => pow(a, P - 2n);
function jdbl(p){
  if (!p || p.y === 0n) return null;
  const A = mod(p.x*p.x), B = mod(p.y*p.y), C = mod(B*B);
  const D = mod(2n*(mod((p.x+B)*(p.x+B)) - A - C)), E = 3n*A, F = mod(E*E);
  const X = mod(F - 2n*D);
  return { x:X, y:mod(E*(D - X) - 8n*C), z:mod(2n*p.y*p.z) };
}
function jadd(a, b){
  if (!a) return b; if (!b) return a;
  const z1 = mod(a.z*a.z), z2 = mod(b.z*b.z);
  const u1 = mod(a.x*z2), u2 = mod(b.x*z1);
  const s1 = mod(a.y*b.z*z2), s2 = mod(b.y*a.z*z1);
  const h = mod(u2 - u1), r = mod(s2 - s1);
  if (h === 0n) return r === 0n ? jdbl(a) : null;
  const h2 = mod(h*h), h3 = mod(h*h2), v = mod(u1*h2);
  const X = mod(r*r - h3 - 2n*v);
  return { x:X, y:mod(r*(v - X) - s1*h3), z:mod(h*a.z*b.z) };
}
function mul(k, pt = G){
  let r = null, q = { x:pt.x, y:pt.y, z:1n };
  while (k){ if (k & 1n) r = jadd(r, q); q = jdbl(q); k >>= 1n; }
  if (!r) return null;
  const zi = inv(r.z), zi2 = mod(zi*zi);
  return { x:mod(r.x*zi2), y:mod(r.y*zi2*zi) };
}

/* ---------- byte helpers ---------- */
function concat(...parts){ const out = new Uint8Array(parts.reduce((a,p) => a + p.length, 0)); let at = 0; for (const p of parts){ out.set(p, at); at += p.length; } return out; }
function num(v, len = 32){ const out = new Uint8Array(len); for (let i = len-1; i >= 0; i--){ out[i] = Number(v & 255n); v >>= 8n; } return out; }
function numFrom(v){ let n = 0n; for (const x of v) n = (n << 8n) + BigInt(x); return n; }
const hex = v => [...v].map(x => x.toString(16).padStart(2,"0")).join("");
function fromHex(s){ if (!/^[0-9a-f]{64}$/i.test(s.trim())) throw Error("invalid"); const a = new Uint8Array(32); for (let i = 0; i < 32; i++) a[i] = parseInt(s.trim().slice(i*2, i*2+2), 16); return a; }
function base64(v){ let s = ""; for (let i = 0; i < v.length; i += 16384) s += String.fromCharCode(...v.subarray(i, i+16384)); return btoa(s); }
function unbase64(s){ const raw = atob(s), out = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out; }
const sha = async v => new Uint8Array(await crypto.subtle.digest("SHA-256", v));
async function tagged(label, data){ const tag = await sha(ENC.encode(label)); return sha(concat(tag, tag, data)); }
const xor = (a, b) => { const c = new Uint8Array(a.length); for (let i = 0; i < a.length; i++) c[i] = a[i] ^ b[i]; return c; };

/* ---------- bech32 nsec ---------- */
const CH = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function bechPoly(v){ let c = 1; for (const x of v){ const b = c >>> 25; c = (c & 0x1ffffff) << 5 ^ x; if (b&1) c ^= 0x3b6a57b2; if (b&2) c ^= 0x26508e6d; if (b&4) c ^= 0x1ea119fa; if (b&8) c ^= 0x3d4233dd; if (b&16) c ^= 0x2a1462b3; } return c >>> 0; }
function bechHrp(h){ const o = []; for (const c of h) o.push(c.charCodeAt(0) >> 5); o.push(0); for (const c of h) o.push(c.charCodeAt(0) & 31); return o; }
function bechChecksum(v){ const p = bechPoly(v.concat([0,0,0,0,0,0])) ^ 1; return [0,1,2,3,4,5].map(i => (p >>> 5*(5-i)) & 31); }
function convertBits(data, from, to, pad){
  let acc = 0, bits = 0; const out = [], max = (1 << to) - 1;
  for (const value of data){ if (value < 0 || value >> from) throw Error("invalid"); acc = (acc << from) | value; bits += from; while (bits >= to){ bits -= to; out.push((acc >> bits) & max); } }
  if (pad){ if (bits) out.push((acc << (to - bits)) & max); } else if (bits >= from || ((acc << (to - bits)) & max)) throw Error("invalid");
  return out;
}
function encodeNsec(secret){ const data = convertBits(secret, 8, 5, true); const cs = bechChecksum(bechHrp("nsec").concat(data)); return "nsec1" + data.map(v => CH[v]).join("") + cs.map(v => CH[v]).join(""); }
function decodeNsec(text){
  const s = text.trim().toLowerCase();
  if (!s.startsWith("nsec1")) return fromHex(s);
  const values = [...s.slice(5)].map(c => CH.indexOf(c));
  if (values.some(v => v < 0) || bechPoly(bechHrp("nsec").concat(values)) !== 1) throw Error("invalid");
  return new Uint8Array(convertBits(values.slice(0, -6), 5, 8, false));
}
function randomSecret(){ let s; do { s = crypto.getRandomValues(new Uint8Array(32)); } while (numFrom(s) === 0n || numFrom(s) >= N); return s; }
function parseSecret(text){ const s = decodeNsec(text); const d = numFrom(s); if (!s || s.length !== 32 || d === 0n || d >= N) throw Error("invalid"); return s; }
const pub = secret => hex(num(mul(numFrom(secret)).x));

/* ---------- BIP-340 signing / Blossom auth ---------- */
async function sign(secret, event){
  const d0 = numFrom(secret), point = mul(d0);
  const d = (point.y & 1n) ? N - d0 : d0, publicX = num(point.x);
  const id = await sha(ENC.encode(JSON.stringify([0, hex(publicX), event.created_at, event.kind, event.tags, event.content])));
  const aux = crypto.getRandomValues(new Uint8Array(32));
  const nonce = await tagged("BIP0340/nonce", concat(xor(num(d), await sha(aux)), publicX, id));
  const k0 = numFrom(nonce) % N; if (k0 === 0n) throw Error("signing failed");
  const rPoint = mul(k0), k = (rPoint.y & 1n) ? N - k0 : k0;
  const e = numFrom(await tagged("BIP0340/challenge", concat(num(rPoint.x), publicX, id))) % N;
  return { ...event, id:hex(id), pubkey:hex(publicX), sig:hex(concat(num(rPoint.x), num(mod(k + e*d, N)))) };
}
async function authorization(verb, hash){
  const now = Math.floor(Date.now()/1000);
  const event = await sign(state.secret, { kind:24242, created_at:now, content:`MyMovieWorld ${verb}`, tags:[["t",verb],["expiration",String(now+300)],["server",new URL(CDN).host],...(hash?[["x",hash]]:[])] });
  return "Nostr " + btoa(JSON.stringify(event));
}
async function derive(secret, salt){
  const source = await crypto.subtle.importKey("raw", secret, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"HKDF", hash:"SHA-256", salt, info:ENC.encode("MyMovieWorld encrypted video v1") }, source, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}

/* ---------- storage / transfer ---------- */
async function opfs(){ if (!isSupported()) throw Error(t().unsupported); return navigator.storage.getDirectory(); }
function updateBusy(name, progress, detail){
  const had = !!document.querySelector(".transfer .fill"), b = state.busy;
  if (had && b && b.name === name && b.progress === progress && b.detail === detail) return;
  state.busy = { name, progress, detail };
  if (!had){ render(); return; }
  document.querySelector(".transfer p").textContent = name || "";
  document.querySelector(".transfer .fill").style.transform = `scaleX(${Math.max(progress||0, 2)/100})`;
  const caps = document.querySelectorAll(".transfer-caption span");
  if (caps[0]) caps[0].textContent = detail || "";
  if (caps[1]) caps[1].textContent = progress ? progress + "%" : "";
}
async function createContainer(file){
  const root = await opfs();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await derive(state.secret, salt);
  const token = `mmw-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const handle = await root.getFileHandle(token, { create:true });
  const writer = await handle.createWritable();
  const header = { v:1, name:file.name, type:file.type || "video/mp4", size:file.size, salt:base64(salt) };
  const put = bytes => writer.write(bytes);
  await put(ENC.encode(MAGIC + "\n" + JSON.stringify(header) + "\n"));
  const reader = file.stream().getReader();
  let index = 0, done = 0, lastPct = -1;
  try {
    while (true){
      const next = await reader.read(); if (next.done) break;
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = await crypto.subtle.encrypt({ name:"AES-GCM", iv, additionalData:ENC.encode(`${header.size}:${index}`) }, key, next.value);
      await put(ENC.encode(JSON.stringify({ i:index, iv:base64(iv), data:base64(new Uint8Array(enc)) }) + "\n"));
      done += next.value.length; index++;
      const pct = Math.round(done / file.size * 62);
      if (pct !== lastPct){ lastPct = pct; updateBusy(file.name, pct, t().preparing); }
    }
  } finally { await writer.close(); }
  return { root, token, staged: await handle.getFile(), header };
}
const PART_SIZE = 32 * 1048576; /* each encrypted part is its own blob: stays under server/proxy size limits and each part gets a fresh auth event */
function putPart(blob, auth, onProgress){
  return new Promise((resolve, reject) => {
    const r = new XMLHttpRequest();
    r.open("PUT", CDN + "/upload");
    r.setRequestHeader("Authorization", auth);
    r.setRequestHeader("Content-Type", "text/plain; charset=utf-8");
    r.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    r.onerror = r.ontimeout = () => reject(Object.assign(Error("Network transfer failed"), { retry:true }));
    r.onload = () => {
      if (r.status >= 200 && r.status < 300){ try { resolve(JSON.parse(r.responseText)); } catch { reject(Error("Bad server response")); } }
      else reject(Object.assign(Error(`${r.getResponseHeader("X-Reason") || r.responseText || "Upload rejected"} (HTTP ${r.status})`), { retry: r.status === 408 || r.status === 429 || r.status >= 500 }));
    };
    r.send(blob);
  });
}
async function uploadPart(blob, sha256, name, base, total, i, count){
  let last;
  for (let attempt = 0; attempt < 4; attempt++){
    try {
      const auth = await authorization("upload", sha256);
      return await putPart(blob, auth, loaded => updateBusy(name, 62 + Math.round((base + loaded) / total * 38), `${t().upload} ${i + 1}/${count}`));
    } catch (e){ last = e; if (!e.retry) break; await new Promise(r => setTimeout(r, 800 * 2 ** attempt)); }
  }
  throw Error(`${last.message} [part ${i + 1}/${count}]`);
}
async function removePart(p){
  const r = await fetch(CDN + "/" + p.sha256, { method:"DELETE", headers:{ Authorization: await authorization("delete", p.sha256) } });
  if (!r.ok && r.status !== 404) throw Error(await r.text());
}
async function stageUpload(file){
  if (!file.type.startsWith("video/")){ setNotice("Video MIME type required.", true); return false; }
  if (!isSupported()){ setNotice(t().unsupported, true); return false; }
  let stage = null; const parts = [];
  try {
    updateBusy(file.name, 1, t().preparing);
    stage = await createContainer(file);
    const total = stage.staged.size, count = Math.max(1, Math.ceil(total / PART_SIZE));
    for (let i = 0; i < count; i++){
      const blob = stage.staged.slice(i * PART_SIZE, Math.min(total, (i + 1) * PART_SIZE));
      const sha256 = hex(await sha(new Uint8Array(await blob.arrayBuffer())));
      const d = await uploadPart(blob, sha256, file.name, i * PART_SIZE, total, i, count);
      parts.push({ sha256: d.sha256 || sha256, url: d.url || `${CDN}/${sha256}`, size: blob.size });
    }
    await stage.root.removeEntry(stage.token);
    const first = parts[0], when = Math.floor(Date.now() / 1000);
    state.catalog[first.sha256] = { ...stage.header, parts, url:first.url, encryptedSize:total, uploaded:when, owner:state.pubkey };
    saveCatalog();
    const d = { sha256:first.sha256, url:first.url, size:total, type:"text/plain", uploaded:when };
    state.movies = [d, ...state.movies.filter(m => m.sha256 !== d.sha256)];
    state.active = d;
    state.busy = { name:file.name, progress:100, detail:t().complete };
    render();
    return true;
  } catch (e) {
    state.busy = null;
    if (stage) try { await stage.root.removeEntry(stage.token); } catch {}
    for (const p of parts) removePart(p).catch(() => {});
    setNotice(e.message || "Upload failed", true);
    return false;
  }
}
async function uploadMany(files){
  const queue = [...files].filter(f => f.type.startsWith("video/"));
  if (!queue.length){ setNotice("Video MIME type required.", true); return; }
  for (const f of queue){ if (!await stageUpload(f)) return; }
  setTimeout(() => { if (state.busy?.progress === 100){ state.busy = null; render(); } }, 2000);
}
async function* partBytes(parts){
  for (const part of parts){
    const r = await fetch(part.url || `${CDN}/${part.sha256}`, { headers:{ Authorization: await authorization("get", part.sha256) } });
    if (!r.ok || !r.body) throw Error(await r.text());
    const reader = r.body.getReader();
    while (true){ const x = await reader.read(); if (x.done) break; yield x.value; }
  }
}
async function* textLines(chunks){
  const dec = new TextDecoder(); let carry = "";
  for await (const c of chunks){
    carry += dec.decode(c, { stream:true }); let cut;
    while ((cut = carry.indexOf("\n")) >= 0){ yield carry.slice(0, cut); carry = carry.slice(cut + 1); }
  }
  carry += dec.decode();
  if (carry) yield carry;
}
async function decryptToOpfs(movie, purpose){
  const root = await opfs();
  const token = `ready-${movie.sha256}-${Date.now()}`;
  const handle = await root.getFileHandle(token, { create:true });
  const writer = await handle.createWritable();
  try {
    const parts = state.catalog[movie.sha256]?.parts || [{ sha256: movie.sha256, url: movie.url }];
    const total = Number(movie.size || 0);
    let read = 0, index = 0, header = null, key = null, lastPct = -1;
    for await (const line of textLines(partBytes(parts))){
      read += line.length + 1;
      if (index === 0){ if (line !== MAGIC) throw Error(t().invalidContainer); index++; continue; }
      if (index === 1){ header = JSON.parse(line); key = await derive(state.secret, unbase64(header.salt)); index++; continue; }
      if (!line) continue;
      const rec = JSON.parse(line);
      const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unbase64(rec.iv), additionalData:ENC.encode(`${header.size}:${rec.i}`) }, key, unbase64(rec.data));
      await writer.write(plain);
      const pct = total ? Math.min(99, Math.round(read / total * 100)) : 0;
      if (pct !== lastPct){ lastPct = pct; updateBusy(header.name, pct, purpose); }
    }
    await writer.close();
    return { root, token, handle, header };
  } catch (e) {
    try { await writer.abort(); } catch {}
    try { await root.removeEntry(token); } catch {}
    throw e;
  }
}
async function clearPlayer(){
  if (state.playerURL){ URL.revokeObjectURL(state.playerURL); state.playerURL = ""; }
  if (state.playerToken){ const tk = state.playerToken; state.playerToken = ""; try { (await navigator.storage.getDirectory()).removeEntry(tk); } catch {} }
}
async function preparePlayback(hash){
  const movie = state.movies.find(m => m.sha256 === hash); if (!movie) return;
  if (!isSupported()){ setNotice(t().unsupported, true); return; }
  try {
    updateBusy(movieName(movie), 1, t().load);
    const ready = await decryptToOpfs(movie, t().load);
    await clearPlayer();
    state.playerURL = URL.createObjectURL(await ready.handle.getFile());
    state.playerToken = ready.token;
    state.catalog[movie.sha256] = { ...state.catalog[movie.sha256], ...ready.header };
    saveCatalog(); state.active = movie; state.busy = null; render();
  } catch (e) { state.busy = null; setNotice(e.message || "Playback preparation failed", true); }
}
async function saveMovie(hash){
  const movie = state.movies.find(m => m.sha256 === hash); if (!movie) return;
  if (!isSupported()){ setNotice(t().unsupported, true); return; }
  try {
    const suggested = (state.catalog[hash]?.name || "encrypted-video.mp4").replace(/[^a-zA-Z0-9._ -]/g, "_");
    const dest = await window.showSaveFilePicker({ suggestedName:suggested, types:[{ description:"Video", accept:{ "video/*":[".mp4",".webm",".mov",".mkv"] } }] });
    updateBusy(suggested, 1, t().saving);
    const ready = await decryptToOpfs(movie, t().saving);
    const out = await dest.createWritable();
    await (await ready.handle.getFile()).stream().pipeTo(out);
    await ready.root.removeEntry(ready.token);
    state.catalog[hash] = { ...state.catalog[hash], ...ready.header }; saveCatalog();
    state.busy = { name:ready.header.name, progress:100, detail:t().saved }; render();
    setTimeout(() => { if (state.busy?.progress === 100){ state.busy = null; render(); } }, 2000);
  } catch (e) { state.busy = null; if (!(e instanceof DOMException && e.name === "AbortError")) setNotice(e.message || "Save failed", true); else render(); }
}
async function removeRemote(movie){
  for (const p of state.catalog[movie.sha256]?.parts || [{ sha256: movie.sha256 }]) await removePart(p);
  state.movies = state.movies.filter(m => m.sha256 !== movie.sha256);
  delete state.catalog[movie.sha256]; state.picked.delete(movie.sha256);
  saveCatalog();
  if (state.active?.sha256 === movie.sha256){ state.active = state.movies[0] || null; await clearPlayer(); }
}
async function deleteMovie(movie){
  try { await removeRemote(movie); state.pending = null; render(); }
  catch (e) { state.pending = null; setNotice(e.message || "Delete failed", true); }
}
async function deleteMany(hashes){
  try { for (const h of hashes){ const m = state.movies.find(x => x.sha256 === h); if (m) await removeRemote(m); } render(); }
  catch (e) { setNotice(e.message || "Delete failed", true); }
}
function sync(){
  if (!state.secret) return;
  state.movies = Object.entries(state.catalog)
    .filter(([, e]) => !e.owner || e.owner === state.pubkey)
    .map(([sha256, e]) => ({ sha256, url:e.url || `${CDN}/${sha256}`, size:Number(e.encryptedSize || e.size || 0), type:"text/plain", uploaded:Number(e.uploaded || 0) }))
    .sort((a, b) => b.uploaded - a.uploaded);
  state.active = state.movies.find(x => x.sha256 === state.active?.sha256) || state.movies[0] || null;
  state.busy = null; state.notice = null; render();
}
function saveSecret(secret){
  state.secret = secret; state.pubkey = pub(secret); state.catalog = readCatalog(state.pubkey);
  state.movies = []; state.active = null; state.picked.clear(); state.keyValue = "";
  clearPlayer();
  localStorage.setItem(KEY_STORE, encodeNsec(secret));
  sync();
}

/* ---------- boot ---------- */
try {
  const saved = localStorage.getItem(KEY_STORE);
  if (saved){ state.secret = parseSecret(saved); state.pubkey = pub(state.secret); state.catalog = readCatalog(state.pubkey); }
} catch { localStorage.removeItem(KEY_STORE); state.secret = null; }
state.secret ? sync() : render();
})();
</script>
